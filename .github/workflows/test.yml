name: Beken Emulator Self-Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Needed for the GitHub Pages deployment of the HTML report.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let a run finish rather than cancelling.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      report_uploaded: ${{ steps.upload_report.outcome == 'success' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build C++ emulator and test suite
      run: make -j4 all

    - name: TuyaMCU protocol unit self-tests (no firmware)
      run: ./unittests tuyamcu

    - name: Tuya flash config parser self-tests
      run: ./unittests tuya_config tuya_config_dump

    - name: Firmware image loader self-tests
      run: ./unittests image_loader

    - name: BLE core register model self-tests (no firmware)
      run: ./unittests blecore

    - name: GPIO input and interrupt model self-tests (no firmware)
      run: ./unittests gpio gpio_emulator

    - name: GPIO button-to-relay firmware regression
      run: ./unittests gpio_button

    - name: Watchdog reboot model self-tests (synthetic firmware)
      run: ./unittests watchdog

    - name: Wi-Fi MAC hardware model self-tests (no firmware)
      run: ./unittests wifimac

    - name: Virtual IP network self-tests (no firmware)
      run: ./unittests netstack

    - name: Virtual 802.11 peer self-tests (no firmware)
      run: ./unittests wifipeer

    - name: WPA2 (protected network) self-tests (no firmware)
      run: ./unittests wpa2

    - name: Chip descriptor, peripheral, and timer model self-tests
      run: ./unittests periph chips timers

    - name: Run full firmware self-tests (also writes report/index.html)
      id: tests
      run: |
        set +e
        ./self_test
        code=$?
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        set -e

    # Upload the report even when tests fail - a failing report is the useful
    # one. Only on push (PRs, especially from forks, cannot deploy Pages).
    - name: Upload report as Pages artifact
      id: upload_report
      if: ${{ always() && github.event_name == 'push' && steps.tests.outcome == 'success' }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: report

    # Surface the real test outcome after the artifact is safely uploaded.
    - name: Reflect test outcome
      if: ${{ always() && steps.tests.outcome == 'success' }}
      run: exit ${{ steps.tests.outputs.exit_code }}

  deploy:
    needs: test
    # always(): deploy the report even if the test job failed. Push-only.
    if: ${{ always() && github.event_name == 'push' && needs.test.outputs.report_uploaded == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy report to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
